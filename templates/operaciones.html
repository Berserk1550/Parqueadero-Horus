<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='operaciones.css') }}">
  
</head>
<body>

  <main id="padre_ppal">
    <header id="barra_superior">
      <span id="bienvenida">Hola {{ usuario }}</span>
      <div id="reloj">
        <span id="fecha_actual"></span>
        <span id="hora_actual"></span>
      </div>
      <button id="cerrar_sesion">Cerrar Sesión</button>
    </header>
  </main>


    <h1 id="tlo">Procesos de Ingreso y Egreso</h1>

    <!-- Zona funcional -->
    <section id="zona_funcional">

          </svg>
          
        </button>
      </div>

      <!-- Grupo de botones (Versión HEAD)  
      <div id="grupo_botones">
        <input type="text" id="placa" name="placa" minlength="6" maxlength="6"
               placeholder="N° Placa" required pattern="[A-Z0-9\-]{6,6}">
        <button type="button" id="btn_ingreso">Ingreso</button>
        <button type="button" id="btn_egreso">Egreso</button>
      </div>
      -->

      <!-- Contadores dinámicos -->
      
  <div id="contadores">
    <div class="contador">
      <div class="espacios" id="espacio_carro">
        <span class="ocupados">Ocupados: {{ conteo_carros }}</span> <br>
        <div class="disponibles-linea"> 
          <span class="label">Disponibles:</span> 
          <span class="disponibles" id="disponible_carro">{{ disponible_carro }}</span>
        </div>
      </div>
    </div>

    <div class="contador">
      <div class="espacios" id="espacio_moto">
        <span class="ocupados">Ocupados: {{ conteo_motos }}</span> <br>
        <div class="disponibles-linea"> 
          <span class="label">Disponibles:</span> 
          <span class="disponibles" id="disponible_moto">{{ disponible_moto }}</span>
        </div>
      </div>
    </div>
  </div>

      <!-- Tablas -->
      <section id="tabla_activos" style="display:none;">
        <h2>Vehículos activos</h2>
        <table>
          <tr><th>Placa</th><th>Cédula</th><th>Ingreso</th></tr>
          <tr><td></td><td></td><td></td></tr>
        </table>
      </section>

      <section id="tabla_historico" style="display:none;">
        <h2>Registros previos</h2>
        <table>
          <tr><th>Placa</th><th>Cédula</th><th>Ingreso</th><th>Salida</th></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
        </table>
      </section>

    </section>
  </main>

  <!-- Modal único -->
  <div id="ventana_proceso" class="modal">
    <div class="modal-contenido">
      <span id="cerrar" class="cerrar">&times;</span>

      <form id="form_operacion">
        <input type="text" name="vehiculo_placa" placeholder="Ingrese placa" maxlength="6" minlength="6" pattern="[A-Za-z]{3}[0-9A-Za-z]{4}">
        <input type="hidden" name="tipo_vehiculo" id="tipo_vehiculo_input">

        <button type="button" id="registrar_ingreso">Registrar ingreso</button>
        <button type="button" id="liberar_salida">Liberar salida</button>
      </form>
    </div>
  </div>


  <!-- Modal estilizado para reemplazar alert -->
<div id="alerta_estilizada" class="alerta-modal" style="display:none;">
  <div class="contenido-alerta">
    <p id="mensaje_alerta"></p>
    <button id="btn_alerta_aceptar">Aceptar</button>
  </div>
</div>
<script src="{{ url_for('static', filename= 'js/reloj_operciones.js')}}"></script>
<script src="{{ url_for('static', filename='js/emergente-ven.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/contadores.js') }}"></script>
</body>
</html>
